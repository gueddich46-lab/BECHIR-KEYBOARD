name: Build BECHIR KEYBOARD APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate PNG launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          echo '' | base64 --decode > app/src/main/res/drawable-nodpi/bechir_launcher.png
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BECHIR-KEYBOARD-debug-APK
          path: app/build/outputs/apk/debug/*.apk
